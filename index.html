<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152f"><meta name="description" content="Curieuse — apprendre, découvrir, comprendre.">
<link rel="manifest" href="manifest.webmanifest"><title>Curieuse</title>
<style>
:root{--n:#07152f;--n2:#12294a;--g:#e9b94f;--c:#fff7e4;--m:#c5d0e2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,var(--n),#10294b);color:var(--c);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{text-align:center;padding:18px 16px 16px;border-bottom:1px solid #d8ad4d55}
.logo{width:104px;height:104px;object-fit:cover;border:2px solid var(--g);border-radius:25px}
h1{font: bold 38px Georgia,serif;color:var(--g);margin:8px 0 2px}.tag{font-size:12px;letter-spacing:.12em;color:var(--m)}
main{max-width:760px;margin:auto;padding:18px}.hero,.panel{background:linear-gradient(145deg,#172f50,#0b1d38);border:1px solid #d8ad4d77;border-radius:20px;padding:18px;margin:10px 0 22px}
.kicker{color:var(--g);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.fact{font:24px/1.35 Georgia,serif;margin:10px 0}.desc{color:var(--m);line-height:1.55}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font:inherit;cursor:pointer}.btn{border:1px solid var(--g);border-radius:999px;padding:10px 14px;color:var(--c);background:transparent;font-weight:650}
.btn.gold{background:var(--g);color:#18243a;border:0}
h2{font: bold 25px Georgia,serif;color:var(--g);margin:20px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:1px solid #ffffff35;border-radius:16px;background:linear-gradient(135deg,#193454,#0b1c37);color:var(--c);padding:15px;text-align:left;min-height:105px}
.tile b{display:block;color:var(--g);font-size:17px;margin-bottom:5px}.muted{color:var(--m);font-size:13px;line-height:1.4}
.panel{display:none}.panel.active{display:block}.item{padding:12px 0;border-bottom:1px solid #ffffff22}.item:last-child{border:0}
.item{cursor:pointer;border-radius:12px;padding:14px;margin:5px 0;background:#ffffff08}
.item:focus{outline:2px solid var(--g)}
.detail{display:none;position:fixed;inset:0;z-index:20;background:#020a18dd;padding:18px;overflow:auto}
.detail.active{display:flex;align-items:center;justify-content:center}
.detail-card{width:min(100%,560px);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#193454,#07152f);border:1px solid var(--g);border-radius:22px;padding:22px;box-shadow:0 20px 70px #0009}

.detail-photo{display:block;width:100%;height:190px;object-fit:cover;border-radius:16px;margin:12px 0;background:#102443}
.detail-art{height:150px;border-radius:16px;background:radial-gradient(circle at 50% 40%,#31577c,#102443);display:flex;align-items:center;justify-content:center;font-size:76px;margin:12px 0}

.detail-art{height:150px;border-radius:16px;background:radial-gradient(circle at 50% 40%,#31577c,#102443);display:flex;align-items:center;justify-content:center;font-size:76px;margin:12px 0}
.detail-title{font:25px/1.3 Georgia,serif;color:var(--c);margin:12px 0}
.detail-text{color:var(--m);line-height:1.65}
.close-row{display:flex;justify-content:space-between;align-items:center}

.quizopt{display:block;width:100%;text-align:left;margin:8px 0;border:1px solid #d8ad4d88;background:#10294b;color:var(--c);border-radius:12px;padding:12px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #d8ad4d88;background:#10294b;color:white;font:inherit}
footer{text-align:center;color:#9eabc1;font-size:12px;padding:22px}
@media(min-width:600px){main{padding:26px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head>

{cat:'Nature',title:'Les papillons goûtent avec leurs pattes.',desc:'Des récepteurs sensoriels situés sur leurs pattes leur permettent notamment de goûter les surfaces et de repérer des plantes adaptées à la ponte.'},
{cat:'Nature',title:'Les abeilles communiquent en dansant.',desc:"En effectuant une danse caractéristique, une abeille peut transmettre aux autres la direction et la distance approximatives d'une source de nourriture."},
{cat:'Nature',title:'Les pieuvres possèdent trois cœurs.',desc:"Deux cœurs pompent le sang vers les branchies pour l'oxygéner. Le troisième le propulse vers le reste du corps."},
{cat:'Nature',title:'Les colibris peuvent voler sur place.',desc:"Leurs ailes effectuent un mouvement particulier qui leur permet de produire de la portance aussi bien à l’aller qu’au retour du battement."},
{cat:'Nature',title:'Les loutres de mer utilisent parfois des outils.',desc:'Elles peuvent utiliser une pierre comme outil pour briser la coquille de certains mollusques.'},
{cat:'Nature',title:'Les flamants roses doivent leur couleur à leur alimentation.',desc:'Des pigments appelés caroténoïdes, présents dans leur alimentation, donnent aux plumes leurs teintes roses ou rouges.'},
{cat:'Nature',title:'Les arbres absorbent du dioxyde de carbone.',desc:"Lors de la photosynthèse, ils utilisent l’énergie lumineuse pour transformer l’eau et le dioxyde de carbone en matière organique ; ils rejettent aussi de l’oxygène."},
{cat:'Nature',title:'Les chauves-souris ne sont pas aveugles.',desc:"De nombreuses espèces utilisent l'écholocalisation pour repérer leur environnement, et elles possèdent aussi des yeux fonctionnels."},
{cat:'Nature',title:'Les coraux sont des animaux.',desc:'Les coraux sont de petits animaux souvent coloniaux. Leurs squelettes calcaires peuvent contribuer à former des récifs.'},
{cat:'Nature',title:'Les graines peuvent voyager très loin.',desc:"Le vent, l'eau et les animaux contribuent à leur dispersion."},
{cat:'Univers',title:'Une journée sur Vénus est plus longue que son année.',desc:'Vénus met environ 243 jours terrestres à tourner sur elle-même, contre environ 225 jours pour faire le tour du Soleil.'},
{cat:'Univers',title:'La lumière du Soleil met environ huit minutes à nous parvenir.',desc:'La lumière se déplace dans le vide à environ 300 000 kilomètres par seconde ; le trajet Soleil-Terre prend un peu plus de huit minutes.'},
{cat:'Univers',title:"La Lune s'éloigne lentement de la Terre.",desc:"Les mesures laser montrent que la distance moyenne entre la Terre et la Lune augmente d'environ 3,8 centimètres par an."},
{cat:'Univers',title:'Jupiter est la plus grande planète du système solaire.',desc:'Son diamètre est un peu plus de onze fois celui de la Terre, ce qui en fait la plus grande planète du système solaire.'},
{cat:'Univers',title:"Saturne possède un vaste système d'anneaux.",desc:'Ses anneaux sont constitués surtout de particules de glace, avec aussi des poussières et des fragments rocheux.'},
{cat:'Univers',title:'Mars abrite le plus grand volcan connu du système solaire.',desc:'Olympus Mons est un immense volcan bouclier martien, le plus haut volcan connu du système solaire.'},
{cat:'Univers',title:'Les étoiles ont des couleurs différentes.',desc:'Leur couleur apparente est liée à leur température de surface : les étoiles bleutées sont généralement plus chaudes que les étoiles rougeâtres.'},
{cat:'Univers',title:"L'espace n'est pas totalement vide.",desc:"Il contient du gaz très diffus, de la poussière, des particules, des rayonnements et des champs magnétiques ; il n’est donc pas parfaitement vide."},
{cat:'Univers',title:'La Voie lactée est notre galaxie.',desc:"Le Soleil est l'une des centaines de milliards d'étoiles de la Voie lactée ; les estimations exactes varient."},
{cat:'Univers',title:'Les astronautes grandissent temporairement en apesanteur.',desc:"En microgravité, les disques entre les vertèbres se détendent et la taille des astronautes peut augmenter temporairement de quelques centimètres."},
{cat:'Sciences',title:"La glace flotte sur l'eau liquide.",desc:"En gelant, l'eau forme une structure moins dense que l'eau liquide."},
{cat:'Sciences',title:"Le cerveau consomme beaucoup d'énergie.",desc:"Chez un adulte au repos, le cerveau utilise environ un cinquième de l'énergie consommée par l'organisme, malgré sa taille relativement faible."},
{cat:'Sciences',title:"L'eau peut exister sous trois états courants.",desc:"Sur Terre, on rencontre couramment l’eau sous forme solide (glace), liquide ou gazeuse (vapeur), selon la température et la pression."},
{cat:'Sciences',title:"Le son a besoin d'un milieu pour se propager.",desc:"Le son est une vibration mécanique : il a besoin d'un milieu matériel, comme l'air, l'eau ou un solide. Il ne se propage pas dans le vide."},
{cat:'Sciences',title:'Les empreintes digitales sont très individuelles.',desc:'Les crêtes de la peau se forment avant la naissance. Leur organisation reste généralement stable, même si les blessures peuvent la modifier.'},
{cat:'Sciences',title:'Le corps adulte compte généralement 206 os.',desc:"Un nouveau-né possède davantage de pièces osseuses ; plusieurs se soudent pendant la croissance, pour aboutir généralement à 206 os chez l’adulte."},
{cat:'Sciences',title:'La lumière blanche contient plusieurs couleurs.',desc:'Un prisme peut disperser la lumière blanche et révéler les couleurs qui la composent.'},
{cat:'Sciences',title:'Les aimants possèdent deux pôles.',desc:"Deux pôles nord-sud s'attirent, tandis que deux pôles de même nom se repoussent."},
{cat:'Sciences',title:'Les plantes fabriquent leur propre matière organique.',desc:"Grâce à la lumière, les plantes utilisent l'eau et le dioxyde de carbone pour fabriquer des sucres et libérer de l'oxygène."},
{cat:'Sciences',title:"La peau est l'organe le plus étendu du corps humain.",desc:'La peau forme une barrière protectrice, aide à réguler la température et permet notamment de percevoir le toucher, la pression et la douleur.'},
{cat:'Histoire',title:"L'écriture est née il y a plusieurs milliers d'années.",desc:"Les premières formes d’écriture connues apparaissent vers la fin du IVe millénaire avant notre ère, notamment en Mésopotamie ; des systèmes anciens se développent aussi en Égypte."},
{cat:'Histoire',title:"La bibliothèque d'Alexandrie fut un grand centre du savoir antique.",desc:"Fondée à l'époque hellénistique, elle fut associée au Mouseion et à un vaste projet de collecte et d'étude des savoirs."},
{cat:'Histoire',title:'La Grande Muraille est un ensemble de fortifications.',desc:"Il s’agit d’un réseau de murs et de fortifications édifiés à différentes époques, notamment pour défendre les territoires chinois du nord."},
{cat:'Histoire',title:'Le papier a été développé en Chine ancienne.',desc:"Des techniques de fabrication du papier se sont développées en Chine avant de se diffuser progressivement vers l'Asie centrale, le monde islamique puis l'Europe."},
{cat:'Histoire',title:'Les Jeux olympiques antiques se déroulaient en Grèce.',desc:"Ils se tenaient à Olympie, dans le Péloponnèse, dans le cadre de fêtes religieuses dédiées à Zeus."},
{cat:'Histoire',title:'Les pyramides de Gizeh sont très anciennes.',desc:"Les trois grandes pyramides de Gizeh furent bâties durant la IVe dynastie de l'Ancien Empire égyptien, il y a environ 4 500 ans."},
{cat:'Histoire',title:'La boussole a transformé la navigation.',desc:"Une boussole aimantée s'aligne approximativement sur le champ magnétique terrestre et indique une direction proche du nord magnétique."},
{cat:'Histoire',title:"L'imprimerie a facilité la diffusion des livres.",desc:"L'imprimerie à caractères mobiles, développée en Europe par Gutenberg au XVe siècle, a fortement accéléré la reproduction et la diffusion des livres."},
{cat:'Histoire',title:'Les routes de la soie reliaient plusieurs régions.',desc:"Les routes de la soie formaient plusieurs réseaux terrestres et maritimes reliant l'Asie, le Moyen-Orient, l'Afrique du Nord et l'Europe."},
{cat:'Histoire',title:"Les premières pièces de monnaie apparaissent dans l'Antiquité.",desc:'Les premières monnaies métalliques standardisées apparaissent notamment en Lydie, en Anatolie, vers le VIIe siècle avant notre ère.'}
];
let current=2;
const $=id=>document.getElementById(id);
function render(i){current=(i+data.length)%data.length;$('fact').textContent=data[current].title;$('desc').textContent=data[current].desc;$('favorite').textContent=isSaved(data[current])?'★ Enregistré':'☆ Favori'}
function saved(){try{return JSON.parse(localStorage.getItem('curieuse-favs')||'[]')}catch(e){return []}}
function isSaved(x){return saved().some(v=>v.title===x.title)}
$('surprise').onclick=()=>render(Math.floor(Math.random()*data.length));
$('listen').onclick=()=>{if(!window.speechSynthesis){alert("La lecture vocale n'est pas disponible sur cet appareil.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(data[current].title+' '+data[current].desc);u.lang='fr-FR';speechSynthesis.speak(u)};
$('favorite').onclick=()=>{let f=saved(),x=data[current];if(isSaved(x))f=f.filter(v=>v.title!==x.title);else f.push(x);localStorage.setItem('curieuse-favs',JSON.stringify(f));render(current)};
function openPanel(title,content){$('panelTitle').textContent=title;$('panelBody').innerHTML=content;$('panel').classList.add('active');$('panel').scrollIntoView({behavior:'smooth',block:'nearest'})}
document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{let t=b.dataset.topic,items=data.filter(x=>x.cat===t);openPanel(t,items.map((x,i)=>`<div class="item" tabindex="0" data-detail-index="${data.indexOf(x)}"><b>${x.title}</b><div class="muted">${x.desc}</div></div>`).join(''));document.querySelectorAll('[data-detail-index]').forEach(el=>{let x=data[Number(el.dataset.detailIndex)];el.onclick=()=>showDetail(x);el.onkeydown=e=>{if(e.key==='Enter')showDetail(x)}})});
$('quizTile').onclick=()=>{let q=[{q:"Combien de cœurs possède une pieuvre ?",a:["Un","Deux","Trois"],ok:2,why:"La pieuvre possède trois cœurs."},{q:"Quelle planète a une journée plus longue que son année ?",a:["Vénus","Mars","Jupiter"],ok:0,why:"Vénus tourne très lentement sur elle-même."},{q:"Que font les abeilles pour communiquer une source de nourriture ?",a:["Elles chantent","Elles dansent","Elles changent de couleur"],ok:1,why:"La danse indique notamment direction et distance."}];let item=q[Math.floor(Math.random()*q.length)];openPanel("Quiz Curieuse",`<p>${item.q}</p>${item.a.map((a,i)=>`<button class="quizopt" data-answer="${i}">${a}</button>`).join('')}<p id="feedback" class="muted"></p>`);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{$('feedback').textContent=Number(b.dataset.answer)===item.ok?'Bonne réponse ! ✨ '+item.why:'Pas tout à fait. '+item.why;document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true)})};

const featureFacts={
ice:["Pourquoi la glace flotte-t-elle ?","En gelant, l'eau forme une structure cristalline qui prend davantage de place. La glace devient donc moins dense que l'eau liquide et flotte."],
bee:["Comment les abeilles fabriquent-elles le miel ?","Les abeilles récoltent le nectar des fleurs, le transforment avec des enzymes et le déshydratent dans la ruche jusqu'à obtenir du miel."],
moon:["D'où vient la Lune ?","L'hypothèse scientifique la plus largement acceptée est qu'un grand impact ancien entre la jeune Terre et un corps céleste a produit les matériaux à l'origine de la Lune."],
octopus:["Pourquoi la pieuvre a-t-elle trois cœurs ?","Deux cœurs pompent le sang vers les branchies. Le troisième le propulse vers le reste du corps."]
};
document.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>{let x=featureFacts[b.dataset.feature];openPanel(x[0],'<p>'+x[1]+'</p>')});


const searchBox=document.getElementById('searchBox');
const searchResults=document.getElementById('searchResults');
searchBox.addEventListener('input',()=>{
 const q=searchBox.value.trim().toLocaleLowerCase('fr');
 searchResults.classList.add('active');
 searchResults.innerHTML='';
 const matches=data.filter(x=>(x.title+' '+x.desc+' '+x.cat).toLocaleLowerCase('fr').includes(q));
 if(!q){searchResults.classList.remove('active');return;}
 if(!matches.length){searchResults.textContent='Aucune découverte trouvée.';return;}
 matches.forEach(x=>{const d=document.createElement('div');d.className='item';d.tabIndex=0;const b=document.createElement('b');b.textContent=x.title;const p=document.createElement('p');p.className='muted';p.textContent=x.desc;d.append(b,p);d.onclick=()=>showDetail(x);d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showDetail(x)}};searchResults.append(d);});
});

function showDetail(x){
 $('detailCategory').textContent=x.cat.toUpperCase();
 const art=$('detailArt');
 art.replaceChildren();
 // Illustration dédiée à chaque fiche : aucune image distante ou ancienne ne peut rester affichée.
 art.textContent=artForTitle[x.title]||"✨";
 art.setAttribute('aria-label',x.title);
 $('detailTitle').textContent=x.title;
 $('detailDesc').textContent=x.desc;
 $('detailFavorite').textContent=isSaved(x)?"★ Enregistré":"☆ Favori";
 $('detail').classList.add('active');
 $('detailListen').onclick=()=>{if(!window.speechSynthesis){alert("La lecture vocale n'est pas disponible.");return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x.title+". "+x.desc);u.lang='fr-FR';speechSynthesis.speak(u);};
 $('detailFavorite').onclick=()=>{let f=saved();if(isSaved(x))f=f.filter(v=>v.title!==x.title);else f.push(x);localStorage.setItem('curieuse-favs',JSON.stringify(f));$('detailFavorite').textContent=isSaved(x)?"★ Enregistré":"☆ Favori";};
}
$('closeDetail').onclick=()=>{$('detail').classList.remove('active');if(window.speechSynthesis)speechSynthesis.cancel();};
$('detail').addEventListener('click',e=>{if(e.target.id==='detail')$('detail').classList.remove('active')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('detail').classList.remove('active')});

render(current);
